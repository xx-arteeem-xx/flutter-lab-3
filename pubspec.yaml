name: flutter_lab_3
description: Лабораторная работа №3 — Flutter UI «FlutterCafé» — Фирсов Артем
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Font — Nunito (EAM design system)
  google_fonts: ^6.2.1

  # URL launching — GitHub link in About screen
  url_launcher: ^6.3.0

  # Theme preference persistence
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#080A11"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
